[package]
name = "feihe"
version = "0.3.19"
edition = "2021"
description = "飞鹤输入法 - TSF (Text Services Framework) 中文输入法，小鹤双拼"
license = "MIT"

[lib]
name = "feihe"
crate-type = ["cdylib"]

# 工作区根同时是 Windows 侧的包（`feihe` = TSF shell）。平台无关的逻辑在
# `core/`（`feihe-core`）里，Android 壳以后直接依赖它，不用碰这个包。
#
# `default-members` 两个都要列：否则在根目录敲 `cargo test` 只测 `feihe`
# 一个包，core 里那 62 项会被**静默跳过**（测试照样全绿，只是少跑了一大半）。
# 这种「绿得没有意义」最坑人，所以拿配置堵死，不靠人记着加 `--workspace`。
[workspace]
members = ["core"]
default-members = [".", "core"]

[dependencies]
# 平台无关的核心（双拼 / 纠错 / 数字 / 简码 / 辅助码表）。它不依赖任何系统 API。
feihe-core = { path = "core" }

# 只保留实际用到的 feature。windows-core 由 windows 再导出，无需单独声明。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # COM：DllGetClassObject / IClassFactory
    "Win32_System_Com",
    # DLL_PROCESS_ATTACH
    "Win32_System_SystemServices",
    # TSF 核心
    "Win32_UI_TextServices",
    # GetKeyState：判断 Ctrl/Alt/Win 修饰键
    "Win32_UI_Input_KeyboardAndMouse",
    # 候选窗：自绘 popup 窗口
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    # ITfCompartment::GetValue/SetValue 要 VARIANT（中英文开关状态）
    "Win32_System_Ole",
    "Win32_System_Variant",
    # 状态浮窗判断「自己是不是前台线程」
    "Win32_System_Threading",
    # 快捷输入取本地时间（GetLocalTime）
    "Win32_System_SystemInformation",
    # `/fc` 反查：OpenClipboard / GetClipboardData 读剪贴板文本
    "Win32_System_DataExchange",
    # 设置窗里的词库导入/导出文件选择框
    "Win32_UI_Controls_Dialogs",
    # 用户词库 user.bin：CreateFileMappingW / MapViewOfFile 做文件映射
    "Win32_System_Memory",
    # CreateFileMappingW 的参数里有 SECURITY_ATTRIBUTES，windows-rs 按参数类型
    # 门控函数导出——不开这个 feature，函数本身就不存在（报 unresolved import）
    "Win32_Security",
    # 简繁转换：LCMapStringEx + LCMAP_TRADITIONAL_CHINESE（Windows 自带 NLS 映射表）
    "Win32_Globalization",
    # 高 DPI：GetDpiForWindow / GetDpiForMonitor / GetThreadDpiAwarenessContext。
    # 我们是进程内的 DLL，改不了宿主进程的 DPI 感知，只能「问系统现在多少 DPI
    # 然后按比例放大自己的窗口」，见 src/dpi.rs。
    "Win32_UI_HiDpi",
    # 全屏检测：SHQueryUserNotificationState（判断是否全屏游戏 / 演示模式）
    # 设置窗「从搜狗导入」还要 SHBrowseForFolderW（手动选目录）
    "Win32_UI_Shell",
    # BROWSEINFOW / ITEMIDLIST：SHBrowseForFolderW 的参数类型在这里
    "Win32_UI_Shell_Common",
    # 从搜狗导入：读注册表里搜狗的安装目录（RegGetValueW）
    "Win32_System_Registry",
] }

# 必须保留：#[implement] 是 windows-core 导出的过程宏，代码里 `use windows_core::...`
# 需要它作为直接依赖（windows 只是再导出模块，不能替代 crate 名）。
windows-core = "0.62"

# 农历 / 干支 / 节气（快捷输入 `nl `gz `jq）统一走 Tyme，MIT。
# 这是整个项目唯一的第三方库：节气要算太阳黄经、四柱要按立春/子时换柱、
# 农历要处理闰月，自己写等于重造万年历，边界几乎必错。
# 代价：+127 KB（它依赖 regex 解析中文名），安装包 1.24 → 1.33 MB。
tyme4rs = "1.5.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
