[package]
name = "feihe"
version = "0.2.4"
edition = "2021"
description = "飞鹤输入法 - TSF (Text Services Framework) 中文输入法，小鹤双拼"
license = "MIT"

[lib]
name = "feihe"
crate-type = ["cdylib"]

[dependencies]
# 只保留实际用到的 feature。windows-core 由 windows 再导出，无需单独声明。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # COM：DllGetClassObject / IClassFactory
    "Win32_System_Com",
    # DLL_PROCESS_ATTACH
    "Win32_System_SystemServices",
    # TSF 核心
    "Win32_UI_TextServices",
    # GetKeyState：判断 Ctrl/Alt/Win 修饰键
    "Win32_UI_Input_KeyboardAndMouse",
    # 候选窗：自绘 popup 窗口
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    # ITfCompartment::GetValue/SetValue 要 VARIANT（中英文开关状态）
    "Win32_System_Ole",
    "Win32_System_Variant",
    # 状态浮窗判断「自己是不是前台线程」
    "Win32_System_Threading",
    # 快捷输入取本地时间（GetLocalTime）
    "Win32_System_SystemInformation",
    # 设置窗里的词库导入/导出文件选择框
    "Win32_UI_Controls_Dialogs",
    # 用户词库 user.bin：CreateFileMappingW / MapViewOfFile 做文件映射
    "Win32_System_Memory",
    # CreateFileMappingW 的参数里有 SECURITY_ATTRIBUTES，windows-rs 按参数类型
    # 门控函数导出——不开这个 feature，函数本身就不存在（报 unresolved import）
    "Win32_Security",
    # 简繁转换：LCMapStringEx + LCMAP_TRADITIONAL_CHINESE（Windows 自带 NLS 映射表）
    "Win32_Globalization",
    # 全屏检测：SHQueryUserNotificationState（判断是否全屏游戏 / 演示模式）
    "Win32_UI_Shell",
] }

# 必须保留：#[implement] 是 windows-core 导出的过程宏，代码里 `use windows_core::...`
# 需要它作为直接依赖（windows 只是再导出模块，不能替代 crate 名）。
windows-core = "0.62"

# 农历 / 干支 / 节气（快捷输入 `nl `gz `jq）统一走 Tyme，MIT。
# 这是整个项目唯一的第三方库：节气要算太阳黄经、四柱要按立春/子时换柱、
# 农历要处理闰月，自己写等于重造万年历，边界几乎必错。
# 代价：+127 KB（它依赖 regex 解析中文名），安装包 1.24 → 1.33 MB。
tyme4rs = "1.5.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
