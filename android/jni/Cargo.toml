[package]
name = "feihe-android"
# **必须跟根 `../Cargo.toml` 的 version 一致。**
#
# 这里不能写 `version.workspace = true`：下面那个空 `[workspace]` 让本 crate 自成
# 一个 workspace（刻意为之，见下方注释），拿不到根 workspace 的继承。
# 所以版本只能手抄，而手抄就会漂——曾经停在 0.3.21 好多个版本没动，导致编译日志
# 里出现 `feihe-android v0.3.21` 而 APK 是 0.3.26，排查时一度以为在跑旧代码。
# 现在 gradle 的 checkJniVersion 任务会在编译 .so 前校验这一行，漂了就构建失败。
version = "0.3.86"
edition = "2021"
publish = false

# 自己是一个独立的 workspace：它只该为 Android 目标编译，混进根 workspace 会让
# Windows 那边的 `cargo build` 顺手编一个没人用的 JNI dll 出来。
[workspace]

[lib]
name = "feihe_android"
crate-type = ["cdylib"]

[dependencies]
feihe-core = { path = "../../core" }

# 唯一一个不在根 workspace 依赖策略里的 crate：`jni` 只编进 Android 的 .so，
# **不进 Windows 的 DLL**，所以安装包体积一分钱没涨。手写 JNI 函数表下标也能做，
# 但下标写错是一次没有诊断信息的崩溃，而这块偏偏是最没法在本机验证的。
[dependencies.jni]
version = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
# 刻意**不设** `panic = "abort"`：边界上每个 JNI 函数都用 catch_unwind 包着，
# 一个 Rust panic 只该让这一次调用返回失败，不该把宿主 App 一起带走——输入法崩
# 掉等于用户正在写的东西没了，这比「候选出不来」严重得多。
